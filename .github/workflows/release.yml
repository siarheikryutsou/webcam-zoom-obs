name: Release

# Пуш тега вида v1.2.3 собирает ZIP с панелью и публикует GitHub Release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build ZIP
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist/webcam-zoom-obs
          cp -r index.html app.js style.css vendor README.md dist/webcam-zoom-obs/
          sed -i "s/^const APP_VERSION = 'dev';/const APP_VERSION = '${VERSION}';/" dist/webcam-zoom-obs/app.js
          grep -q "APP_VERSION = '${VERSION}'" dist/webcam-zoom-obs/app.js
          (cd dist && zip -r ../webcam-zoom-obs.zip webcam-zoom-obs)
          unzip -l webcam-zoom-obs.zip
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" webcam-zoom-obs.zip --title "$GITHUB_REF_NAME" --generate-notes
